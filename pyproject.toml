[project]
name = "rmlsa-optuna-drl"
version = "0.1.0"
description = "Optimización de hiperparámetros con Optuna de un agente DRL (PPO) para RMLSA dinámico en redes ópticas elásticas, sobre DREAM-ON GYM."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "gymnasium>=0.29",
    "optuna>=4.0",
    "numpy",
    "pandas",
    "jsonschema",
    "matplotlib",
    "tensorboard",
    "imageio-ffmpeg",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
